{% extends "base.html" %}

{% block title %}
    Countrycon - Scanner
{% endblock %}
{% block extra_css %}
<style>
    .scanner-page {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 16px 0;
    }
    .scanner-container { width: 100%; max-width: 500px; }

    .scanner-card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 20px;
        text-align: center;
    }
    .scanner-card h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 4px; }
    .scanner-card > p { color: #6b7280; margin-bottom: 12px; }

    #reader { width: 100%; max-width: 400px; margin: 0 auto; }
    #reader video { border-radius: 10px; }

    /* ---------- Resultado ---------- */
    #result {
        display: none;
        margin-top: 16px;
        text-align: left;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--rc);
    }
    #result.is-success { --rc: #15803d; }
    #result.is-warning { --rc: #b45309; }
    #result.is-error   { --rc: #b91c1c; }

    .cc-result__head {
        background: var(--rc);
        color: #fff;
        text-align: center;
        padding: 20px 16px;
    }
    .cc-result__icon  { font-size: 2.75rem; line-height: 1; }
    .cc-result__title { margin: 8px 0 4px; font-size: 1.5rem; font-weight: 700; }
    .cc-result__msg   { margin: 0; font-size: .95rem; opacity: .95; }

    .cc-result__body  { background: #fff; padding: 8px 16px 16px; }

    .cc-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        border-bottom: 1px solid #f1f5f9;
    }
    .cc-row:last-child { border-bottom: 0; }
    .cc-row dt { color: #6b7280; font-weight: 500; margin: 0; }
    .cc-row dd { margin: 0; font-weight: 700; text-align: right; }

    .cc-notice {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 8px;
        padding: 12px;
        border-radius: 10px;
        background: #fef3c7;
        color: #92400e;
        border: 1px solid #fcd34d;
    }
    .cc-notice i { margin-top: 3px; }

    #scan-again { display: none; margin-top: 16px; }
</style>
{% endblock %}


{% block content %}

<div class="scanner-page">

    {% csrf_token %}

    <div class="scanner-container">

        <div class="scanner-card">

            <h1>COUNTRYCON</h1>

            <p>Escanea el código QR del ticket</p>

            <div id="reader"></div>

            <div id="result"></div>

            <button type="button" id="scan-again" class="btn btn-primary btn-lg w-100"
                    onclick="restartScanner()">
                <i class="fa-solid fa-qrcode me-2"></i>Escanear siguiente
            </button>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script src="https://unpkg.com/html5-qrcode"></script>

<script>

    function getCSRFToken() {
        return document.querySelector(
            "[name=csrfmiddlewaretoken]"
        ).value;
    }

    let scanner = null;
    let processing = false;

    console.log("Iniciando scanner...");


const RESULT_ICON = {
    success: "fa-circle-check",
    warning: "fa-triangle-exclamation",
    error:   "fa-circle-xmark",
};

function showResult(type, title, message, ticket = null, usedAt = null) {
    const box = document.getElementById("result");
    const rows = [];

    if (ticket) {
        rows.push(["Código", ticket.code]);
        rows.push(["Tipo", ticket.ticket_type]);
        if (ticket.gift) {
            rows.push(["Regalo", `${ticket.gift.type}: ${ticket.gift.selection}`]);
        }
    }
    if (usedAt) {
        rows.push(["Ingresó", new Date(usedAt).toLocaleString("es-PE")]);
    }

    const rowsHtml = rows.length
        ? `<dl class="mb-0">${rows.map(([k, v]) =>
            `<div class="cc-row"><dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd></div>`
          ).join("")}</dl>`
        : "";

    let partnerHtml = "";
    if (ticket && ticket.partner) {
        const name = [ticket.partner.nombre, ticket.partner.apellido_paterno, ticket.partner.apellido_materno]
            .filter(Boolean).join(" ");
        partnerHtml = `
            <div class="cc-notice">
                <i class="fa-solid fa-child-reaching"></i>
                <div><strong>Menor de edad.</strong><br>Acompañante: ${escapeHtml(name)}</div>
            </div>`;
    }

    box.className = `is-${type}`;
    box.innerHTML = `
        <div class="cc-result__head">
            <i class="fa-solid ${RESULT_ICON[type]} cc-result__icon" aria-hidden="true"></i>
            <h2 class="cc-result__title">${escapeHtml(title)}</h2>
            <p class="cc-result__msg">${escapeHtml(message)}</p>
        </div>
        ${rowsHtml || partnerHtml ? `<div class="cc-result__body">${rowsHtml}${partnerHtml}</div>` : ""}
    `;
    box.style.display = "block";
    box.scrollIntoView({ block: "start", behavior: "smooth" });
    document.getElementById("scan-again").style.display = "block";
    if (navigator.vibrate) navigator.vibrate(type === "success" ? 120 : [120, 80, 120]);
}


    async function validateQR(idQr) {

        try {

            const response = await fetch(
                `${BASE_URL}/api/qr/validate/`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCSRFToken(),
                    },

                    body: JSON.stringify({
                        id_qr: idQr,
                    }),
                }
            );

            const data = await response.json();


            if (response.status === 200) {
                showResult("success", "Entrada válida", "Ingreso registrado.", data.ticket);
            } else if (response.status === 409) {
                showResult("warning", "Entrada ya utilizada", data.message, data.ticket, data.used_at);
            } else if (response.status === 404) {
                showResult("error", "Código no reconocido", data.message || "Este QR no corresponde a una entrada de COUNTRYCON.");
            } else {
                showResult("error", "No se pudo validar", data.message || "No se pudo validar el QR.");
            }

        } catch (error) {

            console.error(error);

            showResult(
                "error",
                "✕ ERROR DE CONEXIÓN",
                "No se pudo conectar con el servidor."
            );
        }
    }


    async function onScanSuccess(decodedText) {

        if (processing) {
            return;
        }

        processing = true;

        console.log("QR detectado:", decodedText);

        try {
            await scanner.stop();
        } catch (error) {
            console.error("Error deteniendo scanner:", error);
        }

        document.getElementById(
            "scan-again"
        ).style.display = "inline-block";

        await validateQR(decodedText);
    }


    function onScanFailure(error) {
        // La librería ejecuta esta función
        // mientras busca un QR.
    }


    function startScanner() {

        scanner = new Html5Qrcode("reader");

        scanner
            .start(
                {
                    facingMode: "environment",
                },
                {
                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 250,
                    },
                },

                onScanSuccess,
                onScanFailure
            )

            .catch((error) => {

                console.error(error);

                showResult(
                    "error",
                    "✕ CÁMARA NO DISPONIBLE",
                    "No fue posible acceder a la cámara."
                );
            });
    }


    function restartScanner() {

        processing = false;

        document.getElementById(
            "result"
        ).style.display = "none";

        document.getElementById(
            "scan-again"
        ).style.display = "none";

        document.getElementById(
            "reader"
        ).innerHTML = "";

        startScanner();
    }


    startScanner();

</script>

{% endblock %}
